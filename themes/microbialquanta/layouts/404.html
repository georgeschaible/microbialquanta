{{ define "main" }}
<article class="article" style="text-align: center; padding-top: 6rem; padding-bottom: 8rem;">
  <div class="eyebrow" style="color: var(--amber); margin-bottom: 1.5rem;">Error 404</div>
  <h1 style="font-family: var(--font-serif); font-size: 3rem; font-weight: 400; letter-spacing: -0.02em; margin-bottom: 1rem;">
    Page not found
  </h1>
  <p style="color: var(--ink-soft); font-size: 1.05rem; max-width: 40ch; margin: 0 auto 2rem;">
    The page you are looking for does not exist, or has moved. Try the navigation above, or head back to the home page.
  </p>
  <a href="/" style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; border: 1px solid var(--ink); color: var(--ink); font-size: 0.9rem;">
    Return home &rarr;
  </a>
</article>
{{ end }}
