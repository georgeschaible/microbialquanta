<nav class="site-nav">
  <a class="brand" href="{{ "/" | relURL }}">
    {{ $brand := .Site.Title }}
    {{ $parts := split $brand " " }}
    {{ if eq (len $parts) 2 }}
      {{ index $parts 0 }} <span class="accent">{{ index $parts 1 }}</span>
    {{ else }}
      {{ $brand }}
    {{ end }}
  </a>

  <button class="menu-toggle" aria-label="Toggle menu">Menu</button>

  <ul class="menu">
    {{ range .Site.Menus.main }}
      <li>
        <a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} class="active"{{ end }}>{{ .Name }}</a>
      </li>
    {{ end }}
  </ul>
</nav>
