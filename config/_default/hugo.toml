baseURL = "https://microbialquanta.com/"
defaultContentLanguage = "en"
title = "Microbial Quanta"

theme = "microbialquanta"

enableRobotsTXT = true
summaryLength = 0

buildDrafts = false
buildFuture = false

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[pagination]
  pagerSize = 20

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = false
    codeFences = true
    guessSyntax = true
    tabWidth = 2

[imaging]
  resampleFilter = "lanczos"
  quality = 85
  anchor = "smart"

[taxonomies]
  tag = "tags"
  category = "categories"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5
